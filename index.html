<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="鲁一恒（Yiheng Lu）的个人主页：经济学博士研究生，研究数字经济、人工智能与产业组织。">
  <meta name="author" content="鲁一恒">
  <!-- 草稿期间不让搜索引擎收录。定稿、想被搜到时，删掉下面这一行 -->
  <meta name="robots" content="noindex">
  <title>鲁一恒 | 经济学博士研究生</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%238c2f39'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23ffffff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<!-- ============================================================
     首页：只是一个"壳"，没有内容文字。要改内容请编辑：
       content/profile.js   姓名 / 简介 / 教育 / 链接
       content/publications.js  论文
       content/thinking.js  思考
       content/products.js  产品
     data-page="home"：告诉 pages.js 按首页渲染；data-root=""：本文件在仓库根目录
     ============================================================ -->
<body data-page="home" data-root="">

  <div id="site-header"></div>

  <section class="hero" id="top">
    <div class="container hero-inner" id="hero"></div>
  </section>

  <!-- 每个区块：左边小标题 + 右边内容（手机上叠成一栏）。调整区块顺序 = 调整下面 section 的先后 -->
  <section class="block">
    <div class="container block-grid">
      <div class="block-head">
        <h2 class="section-title">关于</h2>
        <p class="section-sub">About</p>
      </div>
      <div class="block-body">
        <div id="bio"></div>
        <h3 class="sub-title">教育经历</h3>
        <div class="edu-list" id="education"></div>
      </div>
    </div>
  </section>

  <section class="block">
    <div class="container block-grid">
      <div class="block-head">
        <h2 class="section-title">论文</h2>
        <p class="section-sub">Publications</p>
        <a class="view-all" href="pages/publications.html">全部 →</a>
      </div>
      <ol class="block-body pub-list" id="pub-preview"></ol>
    </div>
  </section>

  <section class="block">
    <div class="container block-grid">
      <div class="block-head">
        <h2 class="section-title">思考</h2>
        <p class="section-sub">Thinking</p>
        <a class="view-all" href="pages/thinking.html">全部 →</a>
      </div>
      <div class="block-body thread-list" id="thinking-list"></div>
    </div>
  </section>

  <section class="block">
    <div class="container block-grid">
      <div class="block-head">
        <h2 class="section-title">产品</h2>
        <p class="section-sub">Tools</p>
        <a class="view-all" href="pages/products.html">全部 →</a>
      </div>
      <div class="block-body cards" id="product-cards"></div>
    </div>
  </section>

  <div id="site-footer"></div>

  <!-- 顺序不能变：数据 → 公共逻辑 → 页面渲染 -->
  <script src="content/site.js"></script>
  <script src="content/profile.js"></script>
  <script src="content/products.js"></script>
  <script src="content/publications.js"></script>
  <script src="content/thinking.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/pages.js"></script>
</body>
</html>
