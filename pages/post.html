<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>文章 · 鲁一恒</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<!-- 文章页（壳）。网址 post.html?id=<slug>，标题/摘要来自 content/thinking.js，正文来自 content/posts/<slug>.md -->
<body data-page="post" data-root="../">
  <div id="site-header"></div>
  <section class="page-header"><div class="container container-narrow">
    <div class="page-tags" id="page-tags"></div>
    <h1 id="page-title"></h1>
    <p class="page-desc" id="page-desc"></p>
    <div class="post-meta" id="post-meta"></div>
  </div></section>
  <section class="block"><div class="container container-narrow">
    <article class="prose" id="prose"><p class="muted" data-i18n="loading">加载中…</p></article>
    <div id="feedback"></div>
    <p class="back-link"><a href="thinking.html" data-i18n="backLink">← 回到思考列表</a></p>
  </div></section>
  <div id="site-footer"></div>
  <script src="../content/site.js"></script>
  <script src="../content/profile.js"></script>
  <script src="../content/thinking.js"></script>
  <script src="../assets/js/core.js"></script>
  <script src="../assets/js/pages.js"></script>
</body>
</html>
